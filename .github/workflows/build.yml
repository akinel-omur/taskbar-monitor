name: build

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Derle
        run: dotnet build -c Release -warnaserror-
      - name: Yayınla (tek dosya)
        run: dotnet publish -c Release --no-build -o publish -p:DebugType=none
      - uses: actions/upload-artifact@v4
        with:
          name: TaskbarMonitor
          path: publish/TaskbarMonitor.exe
