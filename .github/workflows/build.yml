name: build

on:
  push:
    branches: [main, 'claude/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write   # etiket (v*) atılınca GitHub Release oluşturmak için
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Derle ve yayınla (tek dosya)
        shell: pwsh
        run: |
          # v1.2.0 etiketi -> uygulama sürümü 1.2.0 (uygulama içi güncelleme bu sürümü karşılaştırır)
          $extra = @()
          if ($env:GITHUB_REF -like 'refs/tags/v*') { $extra += "-p:Version=$($env:GITHUB_REF_NAME.Substring(1))" }
          dotnet build -c Release @extra
          dotnet publish -c Release --no-build -o publish -p:DebugType=none @extra
      - uses: actions/upload-artifact@v4
        with:
          name: TaskbarMonitor
          path: publish/TaskbarMonitor.exe
      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $hash = (Get-FileHash publish/TaskbarMonitor.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  TaskbarMonitor.exe" | Out-File -Encoding ascii publish/TaskbarMonitor.exe.sha256
          gh release create $env:GITHUB_REF_NAME publish/TaskbarMonitor.exe publish/TaskbarMonitor.exe.sha256 --title $env:GITHUB_REF_NAME --generate-notes
