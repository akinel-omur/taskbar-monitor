name: build

on:
  push:
    branches: [main, 'claude/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Yayınlanacak sürüm etiketi (ör. v1.1.1). Boş bırakılırsa yalnızca derler.'
        required: false
        default: ''

env:
  # Etiket push'unda etiketin adı, elle tetiklemede girilen etiket; aksi halde boş (yayın yok).
  RELEASE_TAG: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write   # GitHub Release (ve gerekirse etiket) oluşturmak için
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Derle ve yayınla (tek dosya)
        shell: pwsh
        run: |
          # v1.2.0 etiketi -> uygulama sürümü 1.2.0 (uygulama içi güncelleme bu sürümü karşılaştırır)
          $tag = $env:RELEASE_TAG
          if ($tag -and $tag -notmatch '^v\d+\.\d+\.\d+$') { throw "Geçersiz etiket: $tag" }
          $extra = @()
          if ($tag) { $extra += "-p:Version=$($tag.Substring(1))" }
          dotnet build -c Release @extra
          dotnet publish -c Release --no-build -o publish -p:DebugType=none @extra
      - uses: actions/upload-artifact@v4
        with:
          name: TaskbarMonitor
          path: publish/TaskbarMonitor.exe
      - name: GitHub Release
        if: env.RELEASE_TAG != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:RELEASE_TAG
          $hash = (Get-FileHash publish/TaskbarMonitor.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  TaskbarMonitor.exe" | Out-File -Encoding ascii publish/TaskbarMonitor.exe.sha256
          $files = @('publish/TaskbarMonitor.exe', 'publish/TaskbarMonitor.exe.sha256')
          # Release önceden varsa (arayüzden yayınlandıysa) dosyaları ona yükle, yoksa etiketle birlikte oluştur.
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) { gh release upload $tag @files --clobber }
          else { gh release create $tag @files --title $tag --generate-notes --target $env:GITHUB_SHA }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
